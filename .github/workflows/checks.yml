name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: >-
          python -m pip install astrbot==4.29.4
          -r requirements.txt
          -r plugins/astrbot_plugin_wechat_native/requirements.txt
          -r plugins/astrbot_plugin_personal_companion/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check manager_app/static/app.js
      - run: python tools/check_source.py
